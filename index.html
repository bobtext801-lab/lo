<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Sign in with Google</title>
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <style>
        html, body { height: 100%; margin: 0; font-family: Inter, system-ui, -apple-system, sans-serif; }
        body { display: flex; align-items: center; justify-content: center; background: #f5f7fa; }
        .card { background: #fff; padding: 28px; border-radius: 12px; box-shadow: 0 8px 24px rgba(0,0,0,0.08); text-align: center; width: 320px; }
        h1 { margin: 0 0 12px; font-size: 18px; color: #0f172a; }
        p.lead { margin: 0 0 18px; color: #374151; font-size: 13px; }
        #token { margin-top: 18px; padding: 10px; background: #f3f4f6; border-radius: 8px; color: #374151; font-size: 12px; word-break: break-all; }
    </style>
</head>
<body>
    <div class="card">
        <h1>Welcome</h1>
        <p class="lead">Sign in quickly using your Google account.</p>

        <!-- Google Sign-in button container -->
        <div id="buttonDiv"></div>

        <!-- Status Message -->
        <div id="token">No token yet.</div>
    </div>

    <script>
        function handleCredentialResponse(response) {
            console.log('Sending HTTP session cookie to backend...');
            const tokenDiv = document.getElementById('token');
            if (tokenDiv) tokenDiv.textContent = 'HTTP Sending session cookie ...';

            fetch('https://bobtext801-backend.onrender.com/api/google-login', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({ token: response.credential })
            })
            .then(res => res.json())
            .then(data => {
                console.log('Server response:', data);
                if (tokenDiv) {
                    tokenDiv.textContent = 'HTTP session cookie sent to backend successfully!';
                }
            })
            .catch(err => {
                console.error('Error sending token:', err);
                if (tokenDiv) {
                    tokenDiv.textContent = 'Failed to connect to backend.';
                }
            });
        }

        window.onload = function () {
            google.accounts.id.initialize({
                client_id: "588066206740-50feus2h2qk27mk3264sq54oartfkkgf.apps.googleusercontent.com",
                callback: handleCredentialResponse
            });

            google.accounts.id.renderButton(
                document.getElementById("buttonDiv"),
                { theme: "outline", size: "large" }
            );
        };
    </script>
</body>
</html>
